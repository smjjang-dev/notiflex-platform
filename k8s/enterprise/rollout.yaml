apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: notiflex-api
  namespace: enterprise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notiflex-api
  template:
    metadata:
      labels:
        app: notiflex-api
    spec:
      imagePullSecrets:
      - name: ghcr-pull
      volumes:
      - name: secrets
        secret:
          secretName: valkey
          items:
          - key: valkey-password
            path: valkey-password
      containers:
      - name: api
        image: ghcr.io/smjjang-dev/notiflex/api:sha-4506e5c
        ports:
        - containerPort: 8080
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: VALKEY_ADDR
          value: valkey-primary.notiflex.svc.cluster.local:6379
        - name: VALKEY_PASSWORD_FILE
          value: /mnt/secrets/valkey-password
        - name: KAFKA_BROKER
          value: notiflex-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: tempo.monitoring.svc.cluster.local:4317
        volumeMounts:
        - name: secrets
          mountPath: /mnt/secrets
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
  strategy:
    canary:
      canaryService: notiflex-api-preview
      stableService: notiflex-api
      analysis:
        templates:
        - templateName: canary-error-rate
          clusterScope: true
        args:
        - name: service-name
          value: notiflex-api-preview
        startingStep: 1
      steps:
      - setWeight: 20
      - pause: {duration: 30s}
      - setWeight: 100
