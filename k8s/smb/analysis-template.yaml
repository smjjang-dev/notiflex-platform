# Cluster-scoped so both k8s/smb and k8s/enterprise Rollouts can reference it
# via templateRef.clusterScope: true. Lives here because notiflex-smb is the
# CI-driven, always-synced ArgoCD app; enterprise's Rollout depends on it too.
apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata:
  name: canary-error-rate
spec:
  args:
  - name: service-name
  metrics:
  - name: error-rate
    interval: 15s
    # canary is aborted after 2 consecutive/total failed measurements
    failureLimit: 2
    successCondition: result[0] < 0.1
    provider:
      prometheus:
        address: http://kube-prometheus-kube-prome-prometheus.monitoring.svc.cluster.local:9090/prometheus
        query: |
          (sum(increase(http_requests_total{service="{{args.service-name}}",code=~"5.."}[1m])) or vector(0))
          /
          (sum(increase(http_requests_total{service="{{args.service-name}}"}[1m])) or vector(1))
