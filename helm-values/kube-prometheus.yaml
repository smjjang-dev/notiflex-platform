prometheus:
  prometheusSpec:
    retention: 2d
    routePrefix: /prometheus/
    # matches the current laptop access path; update to the real host when moved to NAS
    externalUrl: http://localhost/prometheus/
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

grafana:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  adminPassword: admin
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana/"
      serve_from_sub_path: true
  # serve_from_sub_path redirects unprefixed requests (incl. internal /metrics
  # scrapes) to root_url, so the scrape path must match where Grafana actually serves it
  serviceMonitor:
    path: /grafana/metrics

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
