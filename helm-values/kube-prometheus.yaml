prometheus:
  prometheusSpec:
    retention: 2d
    routePrefix: /prometheus/
    # matches the current laptop access path; update to the real host when moved to NAS
    externalUrl: http://localhost/prometheus/
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

grafana:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  adminPassword: admin
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana/"
      serve_from_sub_path: true
  # serve_from_sub_path redirects unprefixed requests (incl. internal /metrics
  # scrapes) to root_url, so the scrape path must match where Grafana actually serves it
  serviceMonitor:
    path: /grafana/metrics
  # the loki chart no longer auto-registers itself as a Grafana datasource
  # (helm-values/loki.yaml's grafana.datasource key is a no-op on this chart
  # version), so register it here instead
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
    # webhook URL lives in the "slack-webhook" Secret (created imperatively,
    # not in git) and gets mounted at /etc/alertmanager/secrets/slack-webhook/
    secrets:
      - slack-webhook
  config:
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/secrets/slack-webhook/url
    inhibit_rules:
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'alertname = InfoInhibitor'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
      - target_matchers:
          - 'alertname = InfoInhibitor'
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'slack'
      routes:
        # Watchdog fires continuously by design (dead man's switch) - keep it
        # out of Slack or it'd post every repeat_interval forever
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
        # kube-prometheus-stack's default rules assume a kubeadm-style control
        # plane; k3s bundles controller-manager/scheduler/kube-proxy inside the
        # single k3s server process, so these are permanently absent and always
        # fire — not real problems, mute them everywhere (including the NAS)
        - receiver: 'null'
          matchers:
            - alertname =~ "KubeControllerManagerDown|KubeSchedulerDown|KubeProxyDown"
    receivers:
      - name: 'null'
      - name: 'slack'
        slack_configs:
          - send_resolved: true
            title: '{{ .CommonAnnotations.summary }}'
            text: '{{ .CommonAnnotations.description }}'
    templates:
      - '/etc/alertmanager/config/*.tmpl'
