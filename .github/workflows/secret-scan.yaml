name: Secret scan

on:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Block populated K8s Secret manifests and obvious credential patterns
      run: |
        set -e
        FOUND=0
        FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)

        for f in $FILES; do
          [ -f "$f" ] || continue
          case "$f" in
            *-secret.yaml|*-secret.yml|*secrets.yaml|*secrets.yml)
              if grep -qE '^kind:[[:space:]]*Secret' "$f" && grep -qE '^[[:space:]]*data:[[:space:]]*$' "$f"; then
                echo "::error file=$f::Populated K8s Secret manifest committed (kind: Secret + data:)"
                FOUND=1
              fi
              ;;
          esac

          if grep -qE '(-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,})' "$f"; then
            echo "::error file=$f::Looks like a private key or API token"
            FOUND=1
          fi
        done

        exit $FOUND
