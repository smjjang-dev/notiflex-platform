name: CI

on:
  push:
    branches: [main]
    paths: [app/**]

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push image
      run: |
        IMAGE="ghcr.io/${{ github.repository_owner }}/notiflex/api:sha-${GITHUB_SHA::7}"
        docker build \
          --build-arg VERSION="sha-${GITHUB_SHA::7}" \
          --build-arg COMMIT="${GITHUB_SHA}" \
          --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -t "$IMAGE" app/
        docker push "$IMAGE"
        echo "IMAGE=$IMAGE" >> $GITHUB_ENV

    - name: Update manifest
      run: |
        sed -i "s|notiflex/api:.*|notiflex/api:sha-${GITHUB_SHA::7}|" k8s/smb/rollout.yaml
        git config user.email "ci@github.com"
        git config user.name "GitHub Actions"
        git add k8s/smb/rollout.yaml
        git commit -m "ci: update image to sha-${GITHUB_SHA::7}" || echo "No changes"
        git push
